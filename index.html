  };
  const IMPORT_DATETIME_FIELDS = ['mockInterviewStartAt', 'mockInterviewEndAt', 'mainStartAt', 'mainEndAt', 'mainInterviewStartAt', 'mainInterviewEndAt'];

  function normHeader(h) { return String(h).toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function truthyImport(v) { return /^(y|yes|true|1)$/i.test(String(v || '').trim()); }

  function mapImportRow(row, headers) {
    const out = {};
    headers.forEach(h => {
      const key = IMPORT_FIELD_MAP[normHeader(h)];
      if (key && row[h]) out[key] = row[h];
    });
    return out;
  }

  function buildBatchesFromImport(headers, rows) {
    const mapped = rows.map(r => mapImportRow(r, headers));
    const groups = new Map();
    const order = [];
    let skipped = 0;
    mapped.forEach(r => {
      const batchName = (r.batch || '').trim();
      if (!batchName) { skipped++; return; }
      const key = batchName + '||' + (r.week || '').trim();
      if (!groups.has(key)) { groups.set(key, []); order.push(key); }
      groups.get(key).push(r);
    });
    let dateWarnings = 0;
    const built = order.map(key => {
      const rowsForBatch = groups.get(key);
      const first = rowsForBatch[0];
      const syllabusItems = rowsForBatch
        .filter(r => r.subject || r.topics)
        .map(r => ({ subject: (r.subject || '').trim(), topics: (r.topics || '').trim() }));
      const existingBatch = batches.find(b => b.batch === first.batch && (b.week || '') === (first.week || '').trim());
      const raw = {
        id: existingBatch ? existingBatch.id : uid(),
        batch: first.batch,
        week: first.week || '',
        syllabusItems: syllabusItems,
        mockRequired: truthyImport(first.mockRequired),
        mockTitle: first.mockTitle || '',
        mockDate: first.mockDate || '',
        mockStart: first.mockStart || '',
        mockEnd: first.mockEnd || '',
        mockTag: first.mockTag || '',
        mockInterviewRequired: first.mockInterviewRequired != null ? truthyImport(first.mockInterviewRequired) : null,
        mockInterviewTitle: first.mockInterviewTitle || '',
        mockInterviewStartAt: first.mockInterviewStartAt || '',
        mockInterviewEndAt: first.mockInterviewEndAt || '',
        mockInterviewDate: first.mockInterviewDate || '',
        mockInterviewStart: first.mockInterviewStart || '',
        mockInterviewEnd: first.mockInterviewEnd || '',
        mockInterviewTag: first.mockInterviewTag || '',
        mainTitle: first.mainTitle || '',
        mainStartAt: first.mainStartAt || '',
        mainEndAt: first.mainEndAt || '',
        mainDate: first.mainDate || '',
        mainStart: first.mainStart || '',
        mainEnd: first.mainEnd || '',
        mainTag: first.mainTag || '',
        mainInterviewTitle: first.mainInterviewTitle || '',
        mainInterviewStartAt: first.mainInterviewStartAt || '',
        mainInterviewEndAt: first.mainInterviewEndAt || '',
        mainInterviewDate: first.mainInterviewDate || '',
        mainInterviewStart: first.mainInterviewStart || '',
        mainInterviewEnd: first.mainInterviewEnd || '',
        mainInterviewTag: first.mainInterviewTag || '',
        mainSebStatus: first.mainSebStatus || ''
      };
      if (raw.mockInterviewRequired === null) delete raw.mockInterviewRequired;
      IMPORT_DATETIME_FIELDS.forEach(f => {
        if (raw[f] && !coerceDT(raw[f])) dateWarnings++;
        if (!raw[f]) delete raw[f];
      });
      return normalizeBatch(raw);
    });
    return { batches: built, skipped: skipped, dateWarnings: dateWarnings };
  }

    }
    else if (action === 'clear-whatsnext-filter') {
      whatsNextDate = todayISO();
      renderTimeline();
    }
    else if (action === 'kpi-nav') {
      dateFilter = { from: overviewDateRange.from, to: overviewDateRange.to };
      activeSection = 'records';
      render();
      const fromEl = document.getElementById('syllabus-filter-from'); if (fromEl) fromEl.value = dateFilter.from;
      const toEl = document.getElementById('syllabus-filter-to'); if (toEl) toEl.value = dateFilter.to;
    }
    else if (action === 'clear-syllabus-filter') {
      dateFilter = { from: '', to: '' };
      searchQuery = '';
      const searchEl = document.getElementById('syllabus-search'); if (searchEl) searchEl.value = '';
      const fromEl = document.getElementById('syllabus-filter-from'); if (fromEl) fromEl.value = '';
      const toEl = document.getElementById('syllabus-filter-to'); if (toEl) toEl.value = '';
      renderRecordsTable();
    }
    else if (action === 'toggle-topics') {
      const key = btn.dataset.key;
      const el = root.querySelector('[data-topics-key="' + key + '"]');
      if (el) {
        const wasExpanded = el.classList.contains('expanded');
        el.classList.toggle('expanded');
        btn.textContent = wasExpanded ? '▸ View topics' : '▾ Hide';
        if (wasExpanded) expandedTopics.delete(key); else expandedTopics.add(key);
      }
    }
    else if (action === 'add-syllabus-item') {
      if (!draft) return;
      draft.syllabusItems.push({ subject: '', topics: '' });
      render();
      requestAnimationFrame(() => {
        const inputs = root.querySelectorAll('.syllabus-subject-input');
        const last = inputs[inputs.length - 1];
        if (last) last.focus();
      });
    }
    else if (action === 'remove-syllabus-item') {
      if (!draft) return;
      draft.syllabusItems.splice(Number(btn.dataset.index), 1);
      render();
    }
    else if (action === 'download-sample') {
      downloadSampleCSV();
    }
    else if (action === 'open-import') {
      if (!canWrite) return;
      openImportModal();
    }
    else if (action === 'close-import') {
      closeImportModal();
    }
    else if (action === 'open-notify') {
      openNotifyModal();
    }
    else if (action === 'close-notify') {
      closeNotifyModal();
    }
    else if (action === 'open-notify-app') {
      openNotifyIn('app');
    }
    else if (action === 'open-notify-web') {
      openNotifyIn('web');
    }
    else if (action === 'open-publish-modal') {
      openPublishModal(id, btn.dataset.type);
    }
    else if (action === 'close-publish-modal') {
      closePublishModal();
    }
    else if (action === 'submit-publish-modal') {
      submitPublishModal();
    }
    else if (action === 'copy-link') {
      const value = btn.dataset.value;
      if (!value) return;
      navigator.clipboard.writeText(value)
        .then(() => flashToast('Link copied.', 'success'))
        .catch(() => flashToast('Could not copy link.', 'error'));
    }
    else if (action === 'pending-link') {
      flashToast("This link isn't available yet.", 'error');
    }
    else if (action === 'open-automation-settings') { openAutomationSettings(); }
    else if (action === 'close-automation-settings') { closeAutomationSettings(); }
    else if (action === 'save-automation-settings') { saveAutomationSettings(); }
    else if (action === 'check-server-health') { checkServerHealth(); }
    else if (action === 'close-progress-modal') { closeProgressModal(); }
    else if (action === 'cancel-automation') { cancelAutomation(); }
    else if (action === 'get-otp-inline') { getOtpInline(); }
    else if (action === 'submit-inline-otp') { submitInlineOTP(); }
    else if (action === 'confirm-import') {
      if (!canWrite || !importPreview || !importPreview.batches.length) return;
      const imported = importPreview.batches;
      const existingIds = new Set(batches.map(b => b.id));
      const newOnes = imported.filter(b => !existingIds.has(b.id));
      const updatedOnes = imported.filter(b => existingIds.has(b.id));
      batches = newOnes.concat(batches.map(ex => updatedOnes.find(u => u.id === ex.id) || ex));
      closeImportModal();
      activeSection = 'records';
      render();
      imported.forEach(persistSave);
      let msg;
      if (newOnes.length && updatedOnes.length) msg = newOnes.length + ' added, ' + updatedOnes.length + ' updated.';
      else if (newOnes.length) msg = newOnes.length + (newOnes.length === 1 ? ' batch imported.' : ' batches imported.');
      else msg = updatedOnes.length + (updatedOnes.length === 1 ? ' batch updated.' : ' batches updated.');
      flashToast(msg, 'success');
    }
  });

  root.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'syllabus-search') { searchQuery = t.value; renderRecordsTable(); return; }
    if (t.id === 'student-search') { studentSearchQuery = t.value; renderStudentsTable(); return; }
    if (t.matches('.student-cell-input')) {
      if (!studentDraft) return;
      studentDraft[t.dataset.field] = t.value;
      return;
    }
    if (t.id === 'config-search') { configSearchQuery = t.value; renderConfigsTable(); return; }
    if (t.id === 'assess-search') { assessSearchQuery = t.value; renderAssessmentsTable(); return; }
    if (t.id === 'interview-search') { interviewSearchQuery = t.value; renderInterviewsTable(); return; }
    if (t.matches('.config-cell-input')) {
      if (!configDraft) return;
      configDraft[t.dataset.field] = t.value;
      return;
    }
    if (t.matches('.interview-cell-input') && t.tagName !== 'SELECT') {
      if (!interviewDraft) return;
      interviewDraft[t.dataset.field] = t.value;
      return;
    }
    if (!draft) return;
    if (t.matches('.syllabus-subject-input')) {
      draft.syllabusItems[Number(t.dataset.index)].subject = t.value;
      return;
    }
    if (t.matches('.syllabus-topics-input')) {
      draft.syllabusItems[Number(t.dataset.index)].topics = t.value;
      return;
    }
    if (t.matches('.cell-input[data-field]') && t.type !== 'date' && t.type !== 'time') {
      draft[t.dataset.field] = t.value;
    }
  });

  root.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'syllabus-filter-from') { dateFilter.from = t.value; renderRecordsTable(); return; }
    if (t.id === 'syllabus-filter-to') { dateFilter.to = t.value; renderRecordsTable(); return; }
    if (t.id === 'ov-from') { overviewDateRange.from = t.value; renderKPICards(); return; }
    if (t.id === 'ov-to') { overviewDateRange.to = t.value; renderKPICards(); return; }
    if (t.id === 'wn-date') { whatsNextDate = t.value; renderTimeline(); return; }
    if (t.id === 'import-file-input') {
      const file = t.files && t.files[0];
      if (file) handleImportFile(file);
      return;
    }
    if (t.id === 'student-import-file-input') {
      const file = t.files && t.files[0];
      if (file) handleStudentImportFile(file);
      return;
    }
    if (t.id === 'student-filter-batch') { studentBatchFilter = t.value; renderStudentsTable(); return; }
    if (t.matches('.row-checkbox')) {
      const id = t.dataset.id;
      if (t.checked) selectedStudentIds.add(id); else selectedStudentIds.delete(id);
      updateStudentSelectionUI(getFilteredStudents());
      return;
    }
    if (t.id === 'student-select-all') {
      const filtered = getFilteredStudents();
      if (t.checked) filtered.forEach(s => selectedStudentIds.add(s.id));
      else filtered.forEach(s => selectedStudentIds.delete(s.id));
      renderStudentsTable();
      return;
    }
    if (t.id === 'publish-modal-confirm-check') {
      publishModalConfirmed = t.checked;
      const submitBtn = document.getElementById('publish-modal-submit');
      if (submitBtn) submitBtn.disabled = !publishModalConfirmed;
      return;
    }
    if (t.matches('.row-checkbox-batch')) {
      const id = t.dataset.id;
      if (t.checked) selectedBatchIds.add(id); else selectedBatchIds.delete(id);
      updateRecordsSelectionUI(getFilteredBatches());
      return;
    }
    if (t.id === 'records-select-all') {
      const filtered = getFilteredBatches();
      if (t.checked) filtered.forEach(b => selectedBatchIds.add(b.id));
      else filtered.forEach(b => selectedBatchIds.delete(b.id));
      renderRecordsTable();
      return;
    }
    if (t.matches('.student-cell-input') && t.tagName === 'SELECT') {
      if (studentDraft) studentDraft[t.dataset.field] = t.value;
      return;
    }
    if (t.id === 'config-filter-batch') { configBatchFilter = t.value; renderConfigsTable(); return; }
    if (t.id === 'assess-filter-batch') { assessBatchFilter = t.value; renderAssessmentsTable(); return; }
    if (t.id === 'assess-filter-status') { assessStatusTab = t.value; renderAssessmentsTable(); return; }
    if (t.id === 'interview-filter-batch') { interviewBatchFilter = t.value; renderInterviewsTable(); return; }
    if (t.matches('.interview-invited-select')) {
      toggleInterviewInvited(t.dataset.id, t.dataset.field, t.value === 'yes');
      return;
    }
    if (t.id === 'config-filter-week') { configWeekFilter = t.value; renderConfigsTable(); return; }
    if (t.id === 'config-filter-from') { configDateFilter.from = t.value; renderConfigsTable(); return; }
    if (t.id === 'config-filter-to') { configDateFilter.to = t.value; renderConfigsTable(); return; }
    if (!draft) return;
    if (t.dataset.action === 'toggle-mock') {
      draft.mockRequired = t.checked;
      if (!draft.mockRequired) draft.mockInterviewRequired = false;
      render();
    } else if (t.dataset.action === 'toggle-mock-interview') {
      if (!draft.mockRequired) return;
      draft.mockInterviewRequired = t.checked;
      render();
    } else if (t.tagName === 'SELECT' && t.dataset.field) {
      draft[t.dataset.field] = t.value;
    } else if (t.matches('.cell-input[data-field]') && (t.type === 'date' || t.type === 'time' || t.type === 'datetime-local')) {
      draft[t.dataset.field] = t.value;
      updateErrorDisplays();
    }
  });

  render();
}
