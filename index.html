*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
.page{max-width:1440px;margin:0 auto;padding:32px 28px 72px;}
.app-header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:18px;}
.app-title{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.01em;color:var(--ink);text-wrap:balance;margin:0;}
.app-subtitle{font-family:var(--font-body);color:var(--muted);font-size:13.5px;margin-top:5px;}
.header-right{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.stats{display:flex;gap:10px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;min-width:92px;}
.stat-value{font-family:var(--font-mono);font-weight:500;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;}
.stat-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:2px;}
.btn{font-family:var(--font-display);font-weight:600;font-size:12.5px;border-radius:8px;padding:9px 16px;border:1px solid transparent;cursor:pointer;transition:background-color .15s ease,border-color .15s ease,color .15s ease;}
.btn--sm{padding:6px 12px;font-size:12px;}
.btn--primary{background:var(--accent);color:#fff;}
.btn--primary:hover{background:var(--accent-ink);}
.btn--primary:disabled{opacity:.5;cursor:not-allowed;}
.btn--ghost{background:transparent;border-color:var(--border);color:var(--ink-2);}
.btn--ghost:hover{background:var(--surface-2);}
.btn--icon-danger{background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 8px;display:inline-flex;align-items:center;}
.btn--icon-danger:hover{color:var(--danger);background:var(--danger-soft);border-color:var(--danger-soft);}
.btn:focus-visible,.cell-input:focus-visible,.chip-input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.access-banner{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber);border-radius:10px;padding:9px 14px;font-size:12.5px;margin-bottom:14px;font-family:var(--font-body);}
.table-wrap{overflow:auto;max-height:74vh;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.04);}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-family:var(--font-body);font-size:13px;}
thead th{position:sticky;background:var(--surface-2);font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:10.5px;color:var(--ink-2);padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left;line-height:16px;}
.thead-groups th{top:0;z-index:4;}
.thead-fields th{top:var(--group-row-h);z-index:3;}
.grp-blue{background:var(--blue-soft);color:var(--blue);}
.grp-amber{background:var(--amber-soft);color:var(--amber);}
.grp-teal{background:var(--accent-soft);color:var(--accent-ink);}
.grp-rose{background:var(--rose-soft);color:var(--rose);}

thead th.col-actions{z-index:5;background:var(--surface-2);}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border-soft);vertical-align:top;}

tr.row-editing td{background:var(--surface-2);}
tr.row-editing td.col-syllabus,tr.row-editing td.col-actions{background:var(--surface-2);}
tr.row-editing td.col-syllabus{box-shadow:inset 3px 0 0 var(--accent),1px 0 0 var(--border);}
.cell-strong{font-family:var(--font-display);font-weight:600;color:var(--ink);}
.empty-dash{color:var(--muted);}
.muted-cell{color:var(--muted);font-size:12px;font-style:italic;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;}
.chips{display:flex;flex-wrap:wrap;gap:4px;max-width:180px;}

.switch{position:relative;display:inline-flex;cursor:pointer;}

.switch-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s ease;}

.badge{font-family:var(--font-display);font-weight:600;font-size:11px;padding:3px 9px;border-radius:999px;letter-spacing:.02em;display:inline-block;}
.badge--yes{background:var(--accent-soft);color:var(--accent-ink);}

.cell-input{width:100%;min-width:104px;font-family:var(--font-body);font-size:12.5px;padding:5px 7px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--ink);}

.field-error{color:var(--danger);font-size:11px;margin-top:4px;font-family:var(--font-body);max-width:130px;}
.actions{display:flex;gap:6px;}
.empty-state{padding:56px 24px;text-align:center;color:var(--muted);font-family:var(--font-body);}

.sidebar-link.active{background:var(--accent-soft);color:var(--accent-ink);}

.cards-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.kpi-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}

.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:6px;}
.kpi-sub{font-size:11.5px;color:var(--ink-2);margin-top:5px;}
.section-heading{font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--ink);margin:0 0 4px;}
.section-desc{font-size:12.5px;color:var(--muted);margin:0 0 16px;}
.filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;}
.filter-field{display:flex;flex-direction:column;gap:4px;}
.filter-field label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
.filter-field input,.filter-field select{font-family:var(--font-body);font-size:12.5px;padding:6px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--ink);min-width:150px;}
.filter-field input[type="date"]{font-family:var(--font-mono);min-width:130px;}
.timeline{display:flex;flex-direction:column;}
.timeline-row{display:grid;grid-template-columns:96px 128px 1fr auto auto;gap:14px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
.timeline-batch{color:var(--muted);font-size:11.5px;margin-left:6px;}
.type-tag{font-family:var(--font-display);font-weight:600;font-size:10.5px;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block;}
.type-tag--blue{background:var(--blue-soft);color:var(--blue);}
.type-tag--amber{background:var(--amber-soft);color:var(--amber);}
.type-tag--teal{background:var(--accent-soft);color:var(--accent-ink);}
.type-tag--rose{background:var(--rose-soft);color:var(--rose);}
.paragraph-text{white-space:pre-wrap;display:block;max-width:220px;line-height:1.4;}
.cell-textarea{min-height:44px;resize:vertical;font-family:var(--font-body);line-height:1.4;}
.item-list{display:flex;flex-direction:column;gap:2px;max-width:220px;}
.item-row{font-size:12.5px;color:var(--ink);padding:3px 0;border-bottom:1px dashed var(--border-soft);}
.item-row:last-child{border-bottom:none;}
.item-list-editor{display:flex;flex-direction:column;gap:6px;min-width:180px;max-width:240px;}
.item-edit-row{display:flex;gap:4px;align-items:center;}
.item-edit-row .cell-input{flex:1;min-width:0;}
.item-add-input{opacity:.85;}
.item-row.paragraph-row{white-space:pre-wrap;}
.switch--disabled{opacity:.45;cursor:not-allowed;}
.switch input:disabled+.switch-track{cursor:not-allowed;}
.students-cell{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
.modal-overlay{position:fixed;inset:0;background:rgba(10,14,10,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-overlay[hidden]{display:none;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:min(640px,100%);max-height:85vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3);}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-header h3{margin:0;font-family:var(--font-display);font-size:16px;color:var(--ink);}
.modal-close{background:none;border:none;font-size:20px;line-height:1;color:var(--muted);cursor:pointer;padding:4px;}
.modal-close:hover{color:var(--danger);}
.modal-body{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border);}
#students-file-input{font-family:var(--font-body);font-size:12.5px;}
.rel-label{color:var(--muted);font-size:11.5px;white-space:nowrap;text-align:right;}
.badge--today{background:var(--amber-soft);color:var(--amber);}
.badge--upcoming{background:var(--accent-soft);color:var(--accent-ink);}
.badge--past{background:var(--surface-2);color:var(--muted);}
@media (max-width: 880px){
  .shell{grid-template-columns:1fr;}
  .sidebar{flex-direction:row;overflow-x:auto;border-radius:14px 14px 0 0;border-right:1px solid var(--border);border-bottom:none;position:static;}
  .content{border-radius:0 0 14px 14px;}
  .cards-grid{grid-template-columns:repeat(2,1fr);}
  .timeline-row{grid-template-columns:1fr;gap:3px;}
  .rel-label{text-align:left;}
}
@media (max-width: 520px){
  .cards-grid{grid-template-columns:1fr;}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;}}

function fullDocumentHTML(batches) {
  return `<!doctype html>
<html lang="en">
<head>

<script>
'use strict';
const CSS = ${JSON.stringify(CSS)};
document.getElementById('app-style').textContent = CSS;
const LS_KEY = ${JSON.stringify(LS_KEY)};
const FIREBASE_SDK_VERSION = ${JSON.stringify(FIREBASE_SDK_VERSION)};
const FIREBASE_CONFIG = ${JSON.stringify(FIREBASE_CONFIG)};
${fullDocumentHTML.toString()}
${boot.toString()}
boot(${JSON.stringify(batches)});

function boot(seedBatches) {
  const ICON_TRASH = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 4H13.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M6 4V2.6C6 2.27 6.27 2 6.6 2H9.4C9.73 2 10 2.27 10 2.6V4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M4.2 4L4.8 12.6C4.85 13.37 5.48 14 6.26 14H9.74C10.52 14 11.15 13.37 11.2 12.6L11.8 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let stored = null;
  try { const raw = localStorage.getItem(LS_KEY); if (raw) stored = JSON.parse(raw); } catch (e) {}
  const base = (stored && Array.isArray(stored) && stored.length) ? stored : seedBatches;
  let batches = base.map(normalizeBatch);

  let editingId = null;
  let draft = null;
  let isNewRow = false;
  let artifactAPI = null;
  let canWrite = true;
  let toastTimer = null;
  let syncMode = 'local';
  let db = null;
  let fs = null;
  let latestRemote = null;
  let activeSection = 'overview';
  let searchQuery = '';
  let dateFilter = { from: '', to: '' };
  let uploadPreview = null;
  const isConfigured = k => FIREBASE_CONFIG[k] && !String(FIREBASE_CONFIG[k]).startsWith('REPLACE_WITH_');
  const firebaseConfigured = ['apiKey','projectId','appId'].every(isConfigured);

  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('artifact').then(a => { artifactAPI = a; });
  } else if (firebaseConfigured) {
    initFirebase();
  }

  async function initFirebase() {
    try {
      const appMod = await import('https://www.gstatic.com/firebasejs/' + FIREBASE_SDK_VERSION + '/firebase-app.js');
      const fsMod = await import('https://www.gstatic.com/firebasejs/' + FIREBASE_SDK_VERSION + '/firebase-firestore.js');
      const app = appMod.initializeApp(FIREBASE_CONFIG);
      db = fsMod.getFirestore(app);
      fs = fsMod;
      syncMode = 'firebase';
      const col = fs.collection(db, 'batches');
      fs.onSnapshot(col, snap => {
        if (snap.empty && !snap.metadata.fromCache) {
          seedFirestore();
          return;
        }
        const list = snap.docs.map(d => normalizeBatch({ id: d.id, ...d.data() }));
        list.sort((a, b) => (a.batch || '').localeCompare(b.batch) || (a.week || '').localeCompare(b.week));
        applyRemoteBatches(list);
      }, err => {
        console.error('Firestore sync error', err);
        syncMode = 'local';
        updateSyncBadge();
        flashToast('Live sync unavailable — saving to this browser only.', 'error');
      });
      updateSyncBadge();
    } catch (err) {
      console.error('Firebase init failed', err);
      syncMode = 'local';
      updateSyncBadge();
    }
  }

  function normalizeList(raw, legacy) {
    if (Array.isArray(raw)) return raw.filter(v => v != null && v !== '');
    if (typeof raw === 'string' && raw.trim()) return raw.split(/\r?\n|,/).map(s => s.trim()).filter(Boolean);
    if (Array.isArray(legacy)) return legacy.filter(v => v != null && v !== '');
    return [];
  }

  function normalizeSyllabusItems(b) {
    if (Array.isArray(b.syllabusItems)) {
      return b.syllabusItems.map(it => ({ subject: (it && it.subject) || '', topics: (it && it.topics) || '' }));
    }
    const subjArr = normalizeList(b.subject, b.subjects);
    const topicArr = normalizeList(b.topic, b.topics);
    if (!subjArr.length && !topicArr.length) return [];
    const topicsJoined = topicArr.join(' | ');
    if (subjArr.length <= 1) return [{ subject: subjArr[0] || '', topics: topicsJoined }];
    return subjArr.map((s, i) => ({ subject: s, topics: i === 0 ? topicsJoined : '' }));
  }

  function normalizeBatch(b) {
    const mockRequired = !!b.mockRequired;
    const inferredMockInterviewRequired = b.mockInterviewRequired != null
      ? !!b.mockInterviewRequired
      : !!(b.mockInterviewDate || b.mockInterviewTitle || b.mockInterviewTag || b.nextDate);
    return {
      id: b.id,
      batch: b.batch != null ? b.batch : (b.firstBatch || ''),
      week: b.week || '',
      syllabusItems: normalizeSyllabusItems(b),
      studentsHeaders: Array.isArray(b.studentsHeaders) ? b.studentsHeaders : [],
      studentsData: Array.isArray(b.studentsData) ? b.studentsData : [],
      mainSebStatus: (b.mainSebStatus === 'SEB' || b.mainSebStatus === 'Non-SEB') ? b.mainSebStatus : 'Non-SEB',
      mockRequired: mockRequired,
      mockTitle: b.mockTitle || '',
      mockDate: b.mockDate || '',
      mockStart: b.mockStart || '',
      mockEnd: b.mockEnd || '',
      mockTag: b.mockTag || '',
      mockInterviewRequired: mockRequired ? inferredMockInterviewRequired : false,
      mockInterviewTitle: b.mockInterviewTitle || '',
      mockInterviewDate: b.mockInterviewDate != null ? b.mockInterviewDate : (b.nextDate || ''),

  function uid() { return 'b' + Math.random().toString(36).slice(2, 9); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function dash() { return '<span class="empty-dash">&mdash;</span>'; }
  function timeToMinutes(t) { if (!t) return null; const p = t.split(':').map(Number); return p[0]*60+p[1]; }
  function fmtDate(iso) {
    if (!iso) return '';
    const parts = iso.split('-').map(Number);
    const dt = new Date(Date.UTC(parts[0], parts[1]-1, parts[2]));
    return dt.toLocaleDateString('en-US', { day:'2-digit', month:'short', year:'numeric', timeZone:'UTC' });
  }
  function fmt12(t) {
    if (!t) return '';
    const p = t.split(':').map(Number);
    const period = p[0] >= 12 ? 'PM' : 'AM';
    const h12 = ((p[0]+11)%12)+1;
    return h12 + ':' + String(p[1]).padStart(2,'0') + ' ' + period;
  }

  function validateDraft(d) {
    const errors = {};
    if (d.mockRequired && d.mockStart && d.mockEnd && timeToMinutes(d.mockEnd) <= timeToMinutes(d.mockStart)) errors.mock = 'End must be after start.';
    if (d.mockInterviewRequired && d.mockInterviewStart && d.mockInterviewEnd && timeToMinutes(d.mockInterviewEnd) <= timeToMinutes(d.mockInterviewStart)) errors.mockInterview = 'End must be after start.';
    if (d.mainStart && d.mainEnd && timeToMinutes(d.mainEnd) <= timeToMinutes(d.mainStart)) errors.main = 'End must be after start.';
    if (d.mainInterviewStart && d.mainInterviewEnd && timeToMinutes(d.mainInterviewEnd) <= timeToMinutes(d.mainInterviewStart)) errors.mainInterview = 'End must be after start.';
    return errors;
  }

  function todayISO() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function relLabel(iso) {
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(iso + 'T00:00:00');
    const diff = Math.round((d - today) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Tomorrow';
    if (diff === -1) return 'Yesterday';
    return diff < 0 ? (Math.abs(diff) + ' days ago') : ('In ' + diff + ' days');
  }

  function buildEvents() {
    const events = [];
    batches.forEach(b => {
      if (b.mainDate) events.push({ type:'Main Assessment', cls:'blue', date:b.mainDate, start:b.mainStart, end:b.mainEnd, batch:b.batch, sub:b.mainTag });
      if (b.mockRequired && b.mockDate) events.push({ type:'Mock Assessment', cls:'amber', date:b.mockDate, start:b.mockStart, end:b.mockEnd, batch:b.batch, sub:b.mockTitle||b.mockTag });
      if (b.mockInterviewRequired && b.mockInterviewDate) events.push({ type:'Mock Interview', cls:'teal', date:b.mockInterviewDate, start:b.mockInterviewStart, end:b.mockInterviewEnd, batch:b.batch, sub:b.mockInterviewTitle||b.mockInterviewTag });
      if (b.mainInterviewDate) events.push({ type:'Main Interview', cls:'rose', date:b.mainInterviewDate, start:b.mainInterviewStart, end:b.mainInterviewEnd, batch:b.batch, sub:b.mainInterviewTitle||b.mainInterviewTag });
    });
    events.sort((a, b) => a.date.localeCompare(b.date) || (a.start||'').localeCompare(b.start||''));
    return events;
  }

  function kpiCard(label, value, sub) {
    return '<div class="kpi-card"><div class="kpi-value">'+value+'</div><div class="kpi-label">'+esc(label)+'</div><div class="kpi-sub">'+esc(sub)+'</div></div>';
  }

  function renderKPICards() {
    const el = document.getElementById('kpi-cards');
    if (!el) return;
    const t = todayISO();
    const totalBatches = batches.length;
    const mainCount = batches.filter(b => b.mainDate).length;
    const mockCount = batches.filter(b => b.mockRequired).length;
    const upcomingInterviews = batches.filter(b => b.mockInterviewRequired && b.mockInterviewDate && b.mockInterviewDate >= t);
    const nextDate = upcomingInterviews.map(b => b.mockInterviewDate).sort()[0];
    el.innerHTML =
      kpiCard('Batches', totalBatches, 'Across all records') +
      kpiCard('Main Assessments', mainCount, mainCount === 1 ? 'Exam scheduled' : 'Exams scheduled') +
      kpiCard('Mock Assessments', mockCount, mockCount === 1 ? 'Batch requires a mock' : 'Batches require a mock') +
      kpiCard('Next Mock Interviews', upcomingInterviews.length, nextDate ? ('Next: ' + fmtDate(nextDate)) : 'None scheduled');
  }

  function renderTimeline() {
    const el = document.getElementById('timeline');
    if (!el) return;
    const t = todayISO();
    const upcoming = buildEvents().filter(e => e.date >= t).slice(0, 8);
    if (!upcoming.length) { el.innerHTML = '<div class="muted-cell">Nothing scheduled.</div>'; return; }
    el.innerHTML = upcoming.map(e =>
      '<div class="timeline-row">'
        + '<span class="mono">' + fmtDate(e.date) + '</span>'
        + '<span class="type-tag type-tag--' + e.cls + '">' + esc(e.type) + '</span>'
        + '<span>' + esc(e.batch) + (e.sub ? '<span class="timeline-batch">' + esc(e.sub) + '</span>' : '') + '</span>'
        + '<span class="mono">' + (e.start ? (fmt12(e.start) + (e.end ? '–' + fmt12(e.end) : '')) : '') + '</span>'
        + '<span class="rel-label">' + relLabel(e.date) + '</span>'
      + '</div>'
    ).join('');
  }

  function batchMatchesDateRange(b, from, to) {
    if (!from && !to) return true;
    const dates = [b.mainDate, (b.mockRequired ? b.mockDate : ''), (b.mockInterviewRequired ? b.mockInterviewDate : ''), b.mainInterviewDate].filter(Boolean);
    if (!dates.length) return false;
    return dates.some(d => (!from || d >= from) && (!to || d <= to));
  }

  function renderRecordsTable() {
    const tbody = document.getElementById('tbody');
    if (!tbody) return;
    const q = searchQuery.trim().toLowerCase();
    let filtered = batches.filter(b => {
      if (q) {
        const syllabusText = b.syllabusItems.map(it => it.subject + ' ' + it.topics).join(' ');
        const hay = [b.batch, b.week, syllabusText, b.mockTitle, b.mockTag, b.mockInterviewTitle, b.mockInterviewTag, b.mainTag, b.mainInterviewTitle, b.mainInterviewTag].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return batchMatchesDateRange(b, dateFilter.from, dateFilter.to);
    });
    if (editingId && !filtered.some(b => b.id === editingId)) {
      const editingBatch = batches.find(b => b.id === editingId);
      if (editingBatch) filtered = [editingBatch].concat(filtered);
    }
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="28"><div class="empty-state">No records match your filters.'+(canWrite?'<div><button type="button" class="btn btn--primary" data-action="add-batch">+ Add Batch</button></div>':'')+'</div></td></tr>';
      return;
    }
    tbody.innerHTML = filtered.map(rowHTML).join('');
  }

  function updateErrorDisplays() {

    const errors = validateDraft(draft);

    Object.keys(map).forEach(k => {
      const el = document.getElementById(map[k] + editingId);
      if (el) { el.textContent = errors[k] || ''; el.hidden = !errors[k]; }
    });

  function flashToast(msg, kind) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'toast show' + (kind === 'error' ? ' error' : '');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast'; }, 2600);
  }

  function persistSave(batchObj) {
    if (syncMode === 'firebase' && db && fs) {
      const { id, ...data } = batchObj;
      fs.setDoc(fs.doc(db, 'batches', id), data).catch(err => {
        console.error('Firestore save failed', err);
        flashToast('Live sync failed — saved to this browser only.', 'error');
        try { localStorage.setItem(LS_KEY, JSON.stringify(batches)); } catch (e) {}
      });
    } else if (artifactAPI) {
      artifactAPI.publish(fullDocumentHTML(batches)).catch(err => {
        const code = err && err.code;
        if (code === 'not_writer' || code === 'not_granted') {
          canWrite = false; render();
          flashToast('This view is read-only — changes are not saved.', 'error');
        } else if (code === 'conflict') {
          /* the view is being reloaded to the newer version */
        } else if (code === 'rate_limited') {
          flashToast('Saving too fast — please wait a moment and try again.', 'error');
        } else {
          try { localStorage.setItem(LS_KEY, JSON.stringify(batches)); } catch (e) {}
        }
      });
    } else {
      try { localStorage.setItem(LS_KEY, JSON.stringify(batches)); } catch (e) {}
    }
  }

  function persistDelete(id) {
    if (syncMode === 'firebase' && db && fs) {
      fs.deleteDoc(fs.doc(db, 'batches', id)).catch(err => {
        console.error('Firestore delete failed', err);
        flashToast('Live sync failed to delete.', 'error');
      });
    } else if (artifactAPI) {
      artifactAPI.publish(fullDocumentHTML(batches)).catch(() => {
        try { localStorage.setItem(LS_KEY, JSON.stringify(batches)); } catch (e) {}
      });
    } else {
      try { localStorage.setItem(LS_KEY, JSON.stringify(batches)); } catch (e) {}
    }
  }

  function startEdit(id) {
    if (!canWrite) return;
    const b = batches.find(x => x.id === id);
    if (!b) return;
    editingId = id; isNewRow = false;
    draft = cloneForEdit(b);
    render();
  }

  function cloneForEdit(b) {
    return {
      ...b,
      syllabusItems: b.syllabusItems.map(it => ({ ...it })),
      studentsHeaders: [...b.studentsHeaders],
      studentsData: b.studentsData.map(r => ({ ...r }))
    };
  }

  function startAdd() {
    if (!canWrite) return;
    activeSection = 'records';
    const id = uid();
    const blank = normalizeBatch({ id });
    batches.unshift(blank);
    editingId = id; isNewRow = true;
    draft = cloneForEdit(blank);
    render();
    requestAnimationFrame(() => {
      const el = document.querySelector('#row-' + id + ' .cell-input[data-field="batch"]');
      if (el) el.focus();
      const rowEl = document.getElementById('row-' + id);
      if (rowEl) rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  function save() {
    const errors = validateDraft(draft);
    if (Object.keys(errors).length) { updateErrorDisplays(); flashToast('Fix the highlighted time ranges before saving.', 'error'); return; }
    if (!draft.batch.trim()) { flashToast('Batch is required.', 'error'); return; }
    const idx = batches.findIndex(b => b.id === editingId);
    if (idx > -1) batches[idx] = { ...draft };
    const saved = { ...draft };
    editingId = null; draft = null; isNewRow = false;
    render();
    persistSave(saved);
    flashToast('Batch saved.', 'success');
  }

  function cancel() {
    if (isNewRow) batches = batches.filter(b => b.id !== editingId);
    editingId = null; draft = null; isNewRow = false;
    if (latestRemote) batches = latestRemote;
    render();
  }

  function removeBatch(id) {
    if (!confirm('Delete this batch? This cannot be undone.')) return;
    batches = batches.filter(b => b.id !== id);
    if (editingId === id) { editingId = null; draft = null; isNewRow = false; }
    render();
    persistDelete(id);
    flashToast('Batch deleted.', 'success');
  }

  function openUploadModal() {
    uploadPreview = null;
    const overlay = document.getElementById('upload-modal-overlay');
    if (overlay) overlay.hidden = false;
    const fileInput = document.getElementById('students-file-input');
    if (fileInput) fileInput.value = '';
    renderUploadPreview();
  }

  function closeUploadModal() {
    const overlay = document.getElementById('upload-modal-overlay');
    if (overlay) overlay.hidden = true;
    uploadPreview = null;
  }

  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        row.push(field); field = '';
      } else if (c === '\n') {
        row.push(field); rows.push(row); row = []; field = '';
      } else if (c === '\r') {
        /* skip */
      } else {
        field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    const nonEmpty = rows.filter(r => r.some(c => c.trim() !== ''));
    if (!nonEmpty.length) return { headers: [], rows: [] };
    const headers = nonEmpty[0].map(h => h.trim());
    const dataRows = nonEmpty.slice(1).map(r => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = (r[i] || '').trim(); });
      return obj;
    });
    return { headers, rows: dataRows };
  }

  function handleStudentsFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = parseCSV(String(reader.result));
        if (!parsed.rows.length) { flashToast('No rows found in that file.', 'error'); }
        uploadPreview = parsed;
      } catch (err) {
        uploadPreview = null;
        flashToast('Could not read that file — make sure it’s a CSV.', 'error');
      }
      renderUploadPreview();
    };
    reader.onerror = () => {
      uploadPreview = null;
      renderUploadPreview();
      flashToast('Could not read that file.', 'error');
    };
    reader.readAsText(file);
  }

  function renderUploadPreview() {
    const el = document.getElementById('upload-preview');
    const confirmBtn = document.getElementById('confirm-upload-btn');
    if (!el) return;
    if (!uploadPreview || !uploadPreview.rows.length) {
      el.innerHTML = '<p class="section-desc">Choose a CSV file to preview its rows before importing.</p>';
      if (confirmBtn) confirmBtn.disabled = true;
      return;
    }
    const previewRows = uploadPreview.rows.slice(0, 20);
    el.innerHTML = '<div class="table-wrap" style="max-height:280px;"><table><thead><tr>'
      + uploadPreview.headers.map(h => '<th>' + esc(h) + '</th>').join('')
      + '</tr></thead><tbody>'
      + previewRows.map(r => '<tr>' + uploadPreview.headers.map(h => '<td>' + (esc(r[h]) || dash()) + '</td>').join('') + '</tr>').join('')
      + '</tbody></table></div>'
      + '<p class="footnote">Showing ' + previewRows.length + ' of ' + uploadPreview.rows.length + ' rows.</p>';
    if (confirmBtn) confirmBtn.disabled = false;
  }

  root.addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;
    if (action === 'edit') startEdit(id);
    else if (action === 'delete') removeBatch(id);
    else if (action === 'save') save();
    else if (action === 'cancel') cancel();
    else if (action === 'add-batch') startAdd();
    else if (action === 'nav') { activeSection = btn.dataset.section; render(); }
    else if (action === 'clear-syllabus-filter') {
      dateFilter = { from: '', to: '' };
      const fromEl = document.getElementById('syllabus-filter-from'); if (fromEl) fromEl.value = '';
      const toEl = document.getElementById('syllabus-filter-to'); if (toEl) toEl.value = '';
      renderRecordsTable();
    }
    else if (action === 'add-syllabus-item') {
      if (!draft) return;
      draft.syllabusItems.push({ subject: '', topics: '' });
      render();
      requestAnimationFrame(() => {
        const inputs = root.querySelectorAll('.syllabus-subject-input');
        const last = inputs[inputs.length - 1];
        if (last) last.focus();
      });
    }
    else if (action === 'remove-syllabus-item') {
      if (!draft) return;
      draft.syllabusItems.splice(Number(btn.dataset.index), 1);
      render();
    }
    else if (action === 'open-upload') {
      if (!draft) return;
      openUploadModal();
    }
    else if (action === 'close-upload') {
      closeUploadModal();
    }
    else if (action === 'confirm-upload') {
      if (!draft || !uploadPreview || !uploadPreview.rows.length) return;
      draft.studentsHeaders = uploadPreview.headers;
      draft.studentsData = uploadPreview.rows;
      closeUploadModal();
      render();
      flashToast('Student data imported.', 'success');
    }
  });

  root.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'syllabus-search') { searchQuery = t.value; renderRecordsTable(); return; }
    if (!draft) return;
    if (t.matches('.syllabus-subject-input')) {
      draft.syllabusItems[Number(t.dataset.index)].subject = t.value;
      return;
    }
    if (t.matches('.syllabus-topics-input')) {
      draft.syllabusItems[Number(t.dataset.index)].topics = t.value;
      return;
    }
    if (t.matches('.cell-input[data-field]') && t.type !== 'date' && t.type !== 'time') {
      draft[t.dataset.field] = t.value;
    }
  });

  root.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'syllabus-filter-from') { dateFilter.from = t.value; renderRecordsTable(); return; }
    if (t.id === 'syllabus-filter-to') { dateFilter.to = t.value; renderRecordsTable(); return; }
    if (t.id === 'students-file-input') {
      const file = t.files && t.files[0];
      if (file) handleStudentsFile(file);
      return;
    }
    if (!draft) return;
    if (t.dataset.action === 'toggle-mock') {
      draft.mockRequired = t.checked;
      if (!draft.mockRequired) draft.mockInterviewRequired = false;
      render();
    } else if (t.dataset.action === 'toggle-mock-interview') {
      if (!draft.mockRequired) return;
      draft.mockInterviewRequired = t.checked;
      render();
    } else if (t.tagName === 'SELECT' && t.dataset.field) {
      draft[t.dataset.field] = t.value;
    } else if (t.matches('.cell-input[data-field]') && (t.type === 'date' || t.type === 'time')) {
      draft[t.dataset.field] = t.value;
      updateErrorDisplays();
    }
  });

  render();
}
