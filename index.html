  // ── Topin publish automation (local server) ────────────────────
  // Publishing and inviting drive a local automation server (server/) that
  // clones the config on the real Topin UI (Playwright) and calls Topin's
  // production invite API. See "Automation Server" in the Assessments page.

  function topinServerUrl() {
    return localStorage.getItem('topinServerUrl') || 'http://localhost:3001';
  }

  function topinAutomationKey() {
    return localStorage.getItem('topinAutomationKey') || '';
  }

  function automationHeaders() {
    const key = topinAutomationKey();
    // ngrok's free tier shows an HTML interstitial instead of proxying the
    // request unless this header is present -- harmless to send always,
    // including to servers that aren't ngrok at all.
    const headers = { 'ngrok-skip-browser-warning': 'true' };
    if (key) headers['X-Automation-Key'] = key;
    return headers;
  }

  function openAutomationSettings() {
    const overlay = document.getElementById('automation-modal-overlay');
    if (!overlay) return;
    document.getElementById('automation-server-url').value = topinServerUrl();
    document.getElementById('automation-key').value = topinAutomationKey();
    document.getElementById('automation-mobile').value = localStorage.getItem('topinMobile') || '';
    document.getElementById('automation-otp').value = localStorage.getItem('topinFixedOtp') || '';
    const dot = document.getElementById('automation-health-dot'); if (dot) dot.className = 'server-health-dot';
    const txt = document.getElementById('automation-health-txt'); if (txt) txt.textContent = 'Not checked';
    overlay.hidden = false;
  }

  function closeAutomationSettings() {
    const overlay = document.getElementById('automation-modal-overlay');
    if (overlay) overlay.hidden = true;
  }

  function saveAutomationSettings() {
    const url = (document.getElementById('automation-server-url').value || '').trim() || 'http://localhost:3001';
    const key = (document.getElementById('automation-key').value || '').trim();
    const mobile = (document.getElementById('automation-mobile').value || '').trim();
    const otp = (document.getElementById('automation-otp').value || '').trim();
    localStorage.setItem('topinServerUrl', url);
    if (key) localStorage.setItem('topinAutomationKey', key); else localStorage.removeItem('topinAutomationKey');
    if (mobile) localStorage.setItem('topinMobile', mobile); else localStorage.removeItem('topinMobile');
    if (otp) localStorage.setItem('topinFixedOtp', otp); else localStorage.removeItem('topinFixedOtp');
    closeAutomationSettings();
    flashToast('Automation settings saved.', 'success');
  }

  async function checkServerHealth() {
    const url = (document.getElementById('automation-server-url').value || '').trim() || 'http://localhost:3001';
    const key = (document.getElementById('automation-key').value || '').trim();
    const dot = document.getElementById('automation-health-dot');
    const txt = document.getElementById('automation-health-txt');
    if (txt) txt.textContent = 'Checking…';
    try {
      const resp = await fetch(url + '/api/health', { headers: { 'ngrok-skip-browser-warning': 'true' }, signal: AbortSignal.timeout(4000) });
      if (!resp.ok) throw new Error('unhealthy');
      const authResp = await fetch(url + '/api/publish/token-status', {
        headers: { 'ngrok-skip-browser-warning': 'true', ...(key ? { 'X-Automation-Key': key } : {}) },
        signal: AbortSignal.timeout(4000)
      });
      if (authResp.status === 401) {
        if (dot) dot.className = 'server-health-dot server-health-dot--bad';
        if (txt) txt.textContent = 'Connected, but the automation key is missing or incorrect';
        return;
      }
      if (dot) dot.className = 'server-health-dot server-health-dot--ok';
      if (txt) txt.textContent = 'Connected';
    } catch (e) {
      if (dot) dot.className = 'server-health-dot server-health-dot--bad';
      if (txt) txt.textContent = 'Not reachable — is the server running?';
    }
  }

  // The progress modal's visible state (log lines, result, OTP box) is driven
  // entirely by these variables and reapplied by renderProgressModal() — never
  // mutated only via one-off DOM writes. This app rebuilds document.body's
  // innerHTML wholesale on every render() (e.g. when a publish finishes and
  // applyPublishResult() calls render()), which would otherwise silently reset
  // or hide this modal mid-flow. renderProgressModal() is also called at the
  // end of the main render(), so any such rebuild restores it correctly.
  function renderProgressModal() {
    const overlay = document.getElementById('progress-modal-overlay');
    if (!overlay) return;
    overlay.hidden = !progressModalOpen;
    if (!progressModalOpen) return;
    const titleEl = document.getElementById('progress-modal-title');
    if (titleEl) titleEl.textContent = progressModalTitle;
    const log = document.getElementById('progress-log');
    if (log) {
      log.innerHTML = progressLogLines.map(l =>
        '<div class="progress-log-line progress-log-line--' + esc(l.type) + '">[' + esc(l.time) + '] ' + esc(l.message) + '</div>'
      ).join('');
      log.scrollTop = log.scrollHeight;
    }
    const box = document.getElementById('progress-creds-box');
    if (box) {
      box.hidden = !progressShowCreds;
      if (progressShowCreds) {
        const mobileEl = document.getElementById('progress-mobile-input');
        if (mobileEl && !mobileEl.value) mobileEl.value = progressMobilePrefill;
      }
    }
    const statusEl = document.getElementById('progress-creds-status');
    if (statusEl) {
      statusEl.textContent = progressCredsStatus ? progressCredsStatus.msg : '';
      statusEl.style.color = !progressCredsStatus ? '' : (progressCredsStatus.kind === 'error' ? 'var(--danger)' : progressCredsStatus.kind === 'success' ? 'var(--accent-ink)' : 'var(--muted)');
    }
    const res = document.getElementById('progress-result');
    if (res) {
      if (progressResult) {
        res.hidden = false;
        res.className = 'progress-result ' + (progressResult.success ? 'progress-result--ok' : 'progress-result--err');
        res.textContent = progressResult.message;
        if (progressResult.assessmentLink) {
          const a = document.createElement('a');
          a.href = progressResult.assessmentLink; a.target = '_blank'; a.rel = 'noopener noreferrer';
          a.textContent = progressResult.assessmentLink;
          res.appendChild(a);
        }
      } else {
        res.hidden = true; res.className = 'progress-result'; res.textContent = '';
      }
    }
    const cancelBtn = document.getElementById('progress-cancel-btn');
    const closeBtn = document.getElementById('progress-close-btn');
    if (cancelBtn) cancelBtn.hidden = !!progressResult;
    if (closeBtn) closeBtn.hidden = !progressResult;
  }

  function openProgressModal(title) {
    progressModalOpen = true;
    progressModalTitle = title;
    progressLogLines = [];
    progressResult = null;
    progressShowCreds = false;
    progressCredsStatus = null;
    progressMobilePrefill = localStorage.getItem('topinMobile') || '';
    window._otpProceed = null;
    renderProgressModal();
  }

  function closeProgressModal() {
    progressModalOpen = false;
    pollStopped = true;
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
    renderProgressModal();
  }

  function logProgress(type, message) {
    progressLogLines.push({ type: type || 'info', message: message, time: new Date().toLocaleTimeString() });
    renderProgressModal();
  }

  function finishProgress(success, message, extra) {
    extra = extra || {};
    progressResult = { success: success, message: message, assessmentLink: extra.assessmentLink || '' };
    renderProgressModal();
  }

  async function cancelAutomation() {
    try { await fetch(topinServerUrl() + '/api/publish/cancel', { method: 'POST', headers: automationHeaders() }); } catch (e) {}
    closeProgressModal();
  }

  function setCredsStatus(msg, kind) {
    progressCredsStatus = { msg: msg, kind: kind };
    renderProgressModal();
  }

  function applyPublishResult(id, type, data) {
    const idx = batches.findIndex(b => b.id === id);
    if (idx === -1) return;
    const now = new Date().toISOString();
    const patch = type === 'main'
      ? { mainPublished: true, mainAssessmentLink: data.assessmentLink || '', mainConfigUrl: data.newConfigLink || batches[idx].mainConfigUrl }
      : { mockPublished: true, mockAssessmentLink: data.assessmentLink || '', mockConfigUrl: data.newConfigLink || batches[idx].mockConfigUrl };
    let updated = { ...batches[idx], ...patch, updatedAt: now };
    const mainDone = !!updated.mainPublished;
    const mockDone = !updated.mockRequired || !!updated.mockPublished;
    if (mainDone && mockDone && !updated.publishedAt) updated = { ...updated, publishedAt: now };
    batches[idx] = updated;
    render();
    persistSave(updated);
  }

  // Polls for progress instead of using EventSource/SSE. EventSource can't
  // send custom headers, which breaks two things it has no way around:
  // the automation key, and ngrok's free-tier interstitial (which otherwise
  // replaces every response with an HTML warning page). A plain fetch()
  // poll carries both.
  function connectSSE(serverUrl, id, type) {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
    pollStopped = false;
    let finished = false;
    let lastSeq = 0;
    let misses = 0;

    const poll = async () => {
      if (pollStopped) return;
      try {
        const resp = await fetch(serverUrl + '/api/publish/poll?since=' + lastSeq, {
          headers: automationHeaders(), signal: AbortSignal.timeout(8000)
        });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        misses = 0;
        for (const entry of (data.entries || [])) {
          lastSeq = Math.max(lastSeq, entry.seq || lastSeq);
          if (entry.type === 'connected') continue;
          logProgress(entry.type, entry.message);
          if (entry.type === 'done') {
            finished = true;
            applyPublishResult(id, type, entry);
            finishProgress(true, 'Published on Topin.', entry);
          }
          if (entry.type === 'error' && !finished) finishProgress(false, 'Error: ' + entry.message);
        }
      } catch (e) {
        misses++;
        if (misses === 3 && !finished) logProgress('error', 'Connection to the automation server was lost.');
      }
      if (!finished && !pollStopped) pollTimer = setTimeout(poll, 1500);
    };
    poll();
  }

  async function postPublishRun(serverUrl, type, params) {
    try {
      const resp = await fetch(serverUrl + '/api/publish/run', {
        method: 'POST', headers: { 'Content-Type': 'application/json', ...automationHeaders() },
        body: JSON.stringify({
          configUrl: params.configUrl, title: params.title,
          assessmentDate: params.assessDate, startTime: params.startTime, endTime: params.endTime,
          uniqueExamId: params.uniqueExamId, isSEB: params.isSEB, isMock: type === 'mock'
        })
      });
      const data = await resp.json();
      if (data.status === 'started') return 'started';
      if (data.status === 'needs_otp') {
        logProgress('info', 'Topin login required — enter your mobile number below and click Get OTP.');
        return 'needs_otp';
      }
      logProgress('error', data.error || 'Unexpected response from the automation server');
      finishProgress(false, 'Failed to start publishing');
      return false;
    } catch (e) {
      logProgress('error', e.message);
      finishProgress(false, 'Connection error — is the local automation server running?');
      return false;
    }
  }

  async function autoOtpLogin(serverUrl, mobile, otp) {
    try {
      const startResp = await fetch(serverUrl + '/api/publish/start', { method: 'POST', headers: { 'Content-Type': 'application/json', ...automationHeaders() }, body: JSON.stringify({ mobile }) });
      const startData = await startResp.json();
      if (startData.status === 'already_authenticated') { logProgress('success', 'Already logged in.'); return true; }
      if (startData.status !== 'otp_sent') { logProgress('error', startData.error || 'Failed to start Topin login'); return false; }
      logProgress('info', 'Verifying with saved OTP...');
      const verifyResp = await fetch(serverUrl + '/api/publish/verify-otp', { method: 'POST', headers: { 'Content-Type': 'application/json', ...automationHeaders() }, body: JSON.stringify({ otp }) });
      const verifyData = await verifyResp.json();
      if (verifyData.status === 'authenticated') { logProgress('success', 'Logged in with saved credentials.'); return true; }
      logProgress('error', verifyData.error || 'OTP verification failed');
      return false;
    } catch (e) { logProgress('error', 'Auto-login failed: ' + e.message); return false; }
  }

  async function getOtpInline() {
    const mobile = (document.getElementById('progress-mobile-input')?.value || '').trim();
    if (!mobile || mobile.length < 10) { setCredsStatus('Enter a valid 10-digit mobile number', 'error'); return; }
    localStorage.setItem('topinMobile', mobile);
    const serverUrl = topinServerUrl();
    const btn = document.getElementById('progress-get-otp-btn');
    if (btn) { btn.textContent = 'Sending…'; btn.disabled = true; }
    try {
      const resp = await fetch(serverUrl + '/api/publish/start', { method: 'POST', headers: { 'Content-Type': 'application/json', ...automationHeaders() }, body: JSON.stringify({ mobile }) });
      const data = await resp.json();
      if (data.status === 'otp_sent') {
        setCredsStatus('OTP sent to ' + mobile.replace(/\d(?=\d{4})/g, '*') + ' — check your phone', 'success');
        const otpEl = document.getElementById('progress-otp-input'); if (otpEl) { otpEl.value = ''; otpEl.focus(); }
      } else if (data.status === 'already_authenticated') {
        progressShowCreds = false;
        setCredsStatus('Already logged in — resuming publish...', 'success');
        if (window._otpProceed) { const p = window._otpProceed; window._otpProceed = null; p(); }
      } else {
        setCredsStatus(data.error || 'Failed to send OTP', 'error');
      }
    } catch (e) { setCredsStatus('Server error: ' + e.message, 'error'); }
    finally { if (btn) { btn.textContent = 'Get OTP'; btn.disabled = false; } }
  }

  async function submitInlineOTP() {
    const otp = (document.getElementById('progress-otp-input')?.value || '').trim();
    if (otp.length !== 6) { setCredsStatus('Enter a valid 6-digit OTP', 'error'); return; }
    const serverUrl = topinServerUrl();

    if (btn) { btn.textContent = 'Verifying…'; btn.disabled = true; }
    try {
      const resp = await fetch(serverUrl + '/api/publish/verify-otp', { method: 'POST', headers: { 'Content-Type': 'application/json', ...automationHeaders() }, body: JSON.stringify({ otp }) });
      const data = await resp.json();
      if (data.status === 'authenticated') {

  }

  async function publishAssessment(id, type) {
    if (!canWrite) return;
    const idx = batches.findIndex(b => b.id === id);
    if (idx === -1) return;
    const b = batches[idx];
    const label = type === 'main' ? 'Main' : 'Mock';
    const configUrl = type === 'main' ? b.mainConfigUrl : b.mockConfigUrl;
    if (!configUrl) { flashToast('Add a ' + label.toLowerCase() + ' config link in Topin Configs first.', 'error'); return; }
    const title = type === 'main' ? b.mainTitle : b.mockTitle;
    if (!title) { flashToast('Set the ' + label.toLowerCase() + ' assessment title first.', 'error'); return; }
    let assessDate, startTime, endTime;
    {
      const s = splitDT(type === 'main' ? b.mainStartAt : b.mockStartAt);
      const e = splitDT(type === 'main' ? b.mainEndAt : b.mockEndAt);
      assessDate = s.date; startTime = s.time; endTime = e.time;
    }
    if (!assessDate || !startTime || !endTime) { flashToast('Set the ' + label.toLowerCase() + ' assessment date and times first.', 'error'); return; }
    if (assessDate < todayISO()) { flashToast('The ' + label.toLowerCase() + ' assessment date (' + fmtDate(assessDate) + ') is in the past — Topin can only schedule future assessments. Update the date first.', 'error'); return; }
    const uniqueExamId = (type === 'main' ? b.mainTag : b.mockTag) || (b.batch + ' ' + label);
    const isSEB = b.mainSebStatus === 'SEB';

    const serverUrl = topinServerUrl();
    try { await fetch(serverUrl + '/api/health', { headers: { 'ngrok-skip-browser-warning': 'true' }, signal: AbortSignal.timeout(3000) }); }
    catch { flashToast('Local automation server not reachable — open Automation Server settings for setup steps.', 'error'); return; }

    openProgressModal(label + ' Assessment — Publish to Topin');
    connectSSE(serverUrl, id, type);

    const params = { configUrl, title, assessDate, startTime, endTime, uniqueExamId, isSEB };
    const run = () => postPublishRun(serverUrl, type, params);
    const outcome = await run();
    if (outcome === 'needs_otp') {
      const savedMobile = localStorage.getItem('topinMobile') || '';
      const savedOtp = localStorage.getItem('topinFixedOtp') || '';
      if (savedMobile && savedOtp) {
        logProgress('info', 'Logging in automatically with saved Topin credentials...');
        const loggedIn = await autoOtpLogin(serverUrl, savedMobile, savedOtp);
        if (loggedIn) { await run(); return; }
        logProgress('error', 'Auto-login failed — falling back to manual entry.');
      }
      progressShowCreds = true;
      progressMobilePrefill = savedMobile;
      setCredsStatus('Enter your Topin mobile number and click Get OTP to log in', 'info');
      window._otpProceed = run;
    }
  }

    try { const u = new URL(link); return u.searchParams.get('org_id') || ''; }

  async function inviteAssessment(id, type) {
    if (!canWrite) return;
    const idx = batches.findIndex(b => b.id === id);
    if (idx === -1) return;
    const b = batches[idx];
    const label = type === 'main' ? 'Main' : 'Mock';
    const link = type === 'main' ? b.mainAssessmentLink : b.mockAssessmentLink;
    const assessmentId = extractOrgId(link);
    if (!assessmentId) { flashToast('No published assessment link found — publish to Topin first.', 'error'); return; }
    const candidates = students.filter(s => s.batch === b.batch).map(s => s.uid).filter(Boolean);
    if (!candidates.length) { flashToast('No students with a UID found for ' + b.batch + '.', 'error'); return; }

    openProgressModal(label + ' Assessment — Invite Students');
    logProgress('info', 'Found ' + candidates.length + ' student' + (candidates.length === 1 ? '' : 's') + '. Sending invites...');
    try {
      const resp = await fetch('/api/invite', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ candidates, assessmentId }) });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        logProgress('error', err.error || ('HTTP ' + resp.status));
        finishProgress(false, 'Invite API error — check that TOPIN_INVITE_API_KEY is set in Vercel.');
        return;
      }
      const result = await resp.json();
      logProgress('info', 'Total: ' + result.total);
      logProgress('success', 'Sent: ' + result.sent + ' invites');
      if (result.failed) logProgress('error', 'Failed: ' + result.failed);
      (result.errors || []).forEach(e => logProgress('error', e));
      if (result.sent > 0) {
        const field = type === 'main' ? 'mainInviteSent' : 'mockInviteSent';
        const atField = type === 'main' ? 'mainInviteSentAt' : 'mockInviteSentAt';
        const updated = { ...batches[idx], [field]: true, [atField]: new Date().toISOString(), updatedAt: new Date().toISOString() };
        batches[idx] = updated;
        render();
        persistSave(updated);
        finishProgress(true, result.sent + ' invite' + (result.sent === 1 ? '' : 's') + ' sent successfully.');
      } else {
        finishProgress(false, 'No invites were sent. Check TOPIN_INVITE_API_KEY in Vercel env vars.');
      }
    } catch (e) { logProgress('error', e.message); finishProgress(false, 'Network error'); }
  }

  function persistSave(batchObj) {
    if (syncMode === 'firebase' && db && fs) {
      const { id, ...data } = batchObj;
      fs.setDoc(fs.doc(db, 'batches', id), data).catch(err => {
        console.error('Firestore save failed', err);
        flashToast('Live sync failed — saved to this browser only.', 'error');
        try { localStorage.setItem(LS_KEY, JSON.stringify(batches)); } catch (e) {}
      });
    } else if (artifactAPI) {
      artifactAPI.publish(fullDocumentHTML(batches, students)).catch(err => {
        const code = err && err.code;
        if (code === 'not_writer' || code === 'not_granted') {
          canWrite = false; render();
          flashToast('This view is read-only — changes are not saved.', 'error');
        } else if (code === 'conflict') {
          /* the view is being reloaded to the newer version */
        } else if (code === 'rate_limited') {
          flashToast('Saving too fast — please wait a moment and try again.', 'error');
        } else {
          try { localStorage.setItem(LS_KEY, JSON.stringify(batches)); } catch (e) {}
        }
      });
    } else {
      try { localStorage.setItem(LS_KEY, JSON.stringify(batches)); } catch (e) {}
    }
  }

  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        row.push(field); field = '';
      } else if (c === '\n') {
        row.push(field); rows.push(row); row = []; field = '';
      } else if (c === '\r') {
        /* skip */
      } else {
        field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    const nonEmpty = rows.filter(r => r.some(c => c.trim() !== ''));
    if (!nonEmpty.length) return { headers: [], rows: [] };
    const headers = nonEmpty[0].map(h => h.trim());
    const dataRows = nonEmpty.slice(1).map(r => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = (r[i] || '').trim(); });
      return obj;
    });
    return { headers, rows: dataRows };
  }

  const IMPORT_FIELD_MAP = {
    batch: 'batch', batchname: 'batch', title: 'batch',
    program: 'program',
    subject: 'subject',
    topics: 'topics', topic: 'topics',
    mockassessmentrequired: 'mockRequired', mockrequired: 'mockRequired',
    mockassessmenttitle: 'mockTitle', mocktitle: 'mockTitle',
    mockassessmentstartdatetime: 'mockStartAt', mockstart: 'mockStartAt', mockassessmentstart: 'mockStartAt',
    mockassessmentenddatetime: 'mockEndAt', mockend: 'mockEndAt', mockassessmentend: 'mockEndAt',
    mockassessmentdate: 'mockDate', mockdate: 'mockDate',
    mockassessmentstarttime: 'mockStart',
    mockassessmentendtime: 'mockEnd',
    mockassessmenttag: 'mockTag', mocktag: 'mockTag',
    mainassessmenttitle: 'mainTitle', maintitle: 'mainTitle',
    mainassessmentstartdatetime: 'mainStartAt', mainstart: 'mainStartAt', mainassessmentstart: 'mainStartAt',
    mainassessmentenddatetime: 'mainEndAt', mainend: 'mainEndAt', mainassessmentend: 'mainEndAt',
    mainassessmentdate: 'mainDate', maindate: 'mainDate',
    mainassessmentstarttime: 'mainStart',
    mainassessmentendtime: 'mainEnd',
    mainassessmenttag: 'mainTag', maintag: 'mainTag',
    mainassessmentsebstatus: 'mainSebStatus', sebstatus: 'mainSebStatus'
  };
  const IMPORT_DATETIME_FIELDS = ['mockStartAt', 'mockEndAt', 'mainStartAt', 'mainEndAt'];

  function normHeader(h) { return String(h).toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function truthyImport(v) { return /^(y|yes|true|1)$/i.test(String(v || '').trim()); }

  function mapImportRow(row, headers) {
    const out = {};
    headers.forEach(h => {
      const key = IMPORT_FIELD_MAP[normHeader(h)];
      if (key && row[h]) out[key] = row[h];
    });
    return out;
  }

  function buildBatchesFromImport(headers, rows) {
    const mapped = rows.map(r => mapImportRow(r, headers));
    const groups = new Map();
    const order = [];
    let skipped = 0;
    mapped.forEach(r => {
      const batchName = (r.batch || '').trim();
      if (!batchName) { skipped++; return; }
      const key = batchName;
      if (!groups.has(key)) { groups.set(key, []); order.push(key); }
      groups.get(key).push(r);
    });
    let dateWarnings = 0;
    const built = order.map(key => {
      const rowsForBatch = groups.get(key);
      const first = rowsForBatch[0];
      const syllabusItems = rowsForBatch
        .filter(r => r.subject || r.topics)
        .map(r => ({ subject: (r.subject || '').trim(), topics: (r.topics || '').trim() }));
      const existingBatch = batches.find(b => b.batch === first.batch);
      const raw = {
        id: existingBatch ? existingBatch.id : uid(),
        batch: first.batch,
        program: first.program || (existingBatch ? existingBatch.program : '') || '',
        syllabusItems: syllabusItems,
        mockRequired: truthyImport(first.mockRequired),
        mockTitle: first.mockTitle || '',
        mockStartAt: first.mockStartAt || '',
        mockEndAt: first.mockEndAt || '',
        mockDate: first.mockDate || '',
        mockStart: first.mockStart || '',
        mockEnd: first.mockEnd || '',
        mockTag: first.mockTag || '',
        mainTitle: first.mainTitle || '',
        mainStartAt: first.mainStartAt || '',
        mainEndAt: first.mainEndAt || '',
        mainDate: first.mainDate || '',
        mainStart: first.mainStart || '',
        mainEnd: first.mainEnd || '',
        mainTag: first.mainTag || '',
        mainSebStatus: first.mainSebStatus || ''
      };
      IMPORT_DATETIME_FIELDS.forEach(f => {
        if (raw[f] && !coerceDT(raw[f])) dateWarnings++;
        if (!raw[f]) delete raw[f];
      });
      return normalizeBatch(raw);
    });
    return { batches: built, skipped: skipped, dateWarnings: dateWarnings };
  }

  function mapStudentImportRow(row, headers) {
    const out = {};
    headers.forEach(h => {
      const key = STUDENT_IMPORT_FIELD_MAP[normHeader(h)];
      if (key && row[h]) out[key] = row[h];
    });
    return out;
  }

  function buildStudentsFromImport(headers, rows, forcedBatch) {
    let skipped = 0;
    const built = [];
    rows.forEach(r => {
      const mapped = mapStudentImportRow(r, headers);
      if (!mapped.name && !mapped.studentId && !mapped.uid) { skipped++; return; }
      if (forcedBatch) mapped.batch = forcedBatch;
      const existing = students.find(s =>
        (mapped.uid && s.uid && s.uid === mapped.uid) ||
        (mapped.studentId && s.studentId && s.studentId === mapped.studentId)
      );
      const id = existing ? existing.id : uid();
      built.push(normalizeStudent({ ...(existing || {}), ...mapped, id: id }));
    });
    return { students: built, skipped: skipped };
  }
